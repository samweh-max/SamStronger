<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Samflyer</title>
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Samflyer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.23.0/dist/maplibre-gl.css">
<style>
:root{--st:env(safe-area-inset-top,0px);--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--sheet-w:560px;--tab-h:64px}
[data-theme=dark]{--space:#02040A;--water:#0B1220;--sheet:rgba(20,20,26,.86);--sheet-solid:#14141A;--page:#0B0B0F;--card:rgba(255,255,255,.07);--card-solid:#17171C;--text:#F5F5F7;--muted:#A3A3AE;--line:rgba(255,255,255,.12);--amber:#FFB020;--amber-bg:rgba(255,176,32,.15);--green:#3DDC6A;--green-bg:rgba(61,220,106,.14);--blue:#5EC8FF;--blue-bg:rgba(94,200,255,.15);--on-blue:#0B1220;--handle:rgba(255,255,255,.3);--arc:#5EC8FF;--arc-dim:rgba(94,200,255,.45);--label:#CFE3FF;--plane:#FFFFFF;--red:#FF6B5E;--red-bg:rgba(255,107,94,.15)}
[data-theme=light]{--space:#E6ECF4;--water:#CFE0F2;--sheet:rgba(255,255,255,.9);--sheet-solid:#FFFFFF;--page:#F2F2F5;--card:rgba(0,0,0,.045);--card-solid:#FFFFFF;--text:#111114;--muted:#5A5A64;--line:rgba(0,0,0,.12);--amber:#8A5300;--amber-bg:rgba(200,120,0,.14);--green:#1B7F35;--green-bg:rgba(27,127,53,.12);--blue:#1E6FD9;--blue-bg:rgba(30,111,217,.12);--on-blue:#FFFFFF;--handle:rgba(0,0,0,.25);--arc:#1E6FD9;--arc-dim:rgba(30,111,217,.5);--label:#18324F;--plane:#0E1A2B;--red:#B3261E;--red-bg:rgba(179,38,30,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--space);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.mono{font-family:"Space Mono",ui-monospace,Menlo,monospace}
.num{font-variant-numeric:tabular-nums}
#app{position:fixed;left:0;top:0;width:100%;height:100vh;height:var(--app-h,100vh);overflow:hidden}
#map{position:absolute;inset:0;background:var(--space);z-index:0}
#map-fallback{position:absolute;left:0;right:0;top:calc(var(--safe-top) + 120px);text-align:center;color:var(--muted);font-size:13px;z-index:1;display:none}
body.no-map #map,body.no-map #map-fallback,body.no-map #topbar{display:none}
body.no-map{background:var(--page)}
.maplibregl-map{font-family:inherit}
.maplibregl-ctrl-top-right{top:calc(var(--safe-top) + 64px)!important}
.maplibregl-ctrl-attrib+.maplibregl-ctrl-attrib{display:none!important}
.maplibregl-ctrl-attrib.maplibregl-compact{background:var(--sheet)!important;color:var(--muted)}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}
.plane-icon{color:var(--plane);filter:drop-shadow(0 0 6px var(--arc));width:30px;height:30px}
#topbar{position:absolute;z-index:20;top:calc(var(--safe-top) + 14px);left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}
#topbar>div{display:flex;gap:8px;align-items:center;pointer-events:auto}
.round{width:44px;height:44px;border-radius:22px;border:none;background:var(--sheet);color:var(--text);display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 2px 10px rgba(0,0,0,.2)}
.chip-float{font-size:12px;font-weight:800;padding:8px 12px;border-radius:999px;background:var(--sheet);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#sheet{position:absolute;z-index:10;left:0;right:0;margin:0 auto;max-width:var(--sheet-w);bottom:0;height:calc(100% - var(--safe-top) - 64px);background:var(--sheet);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border-radius:28px 28px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;transform:translateY(40%);will-change:transform}
#sheet.anim{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
body.no-map #sheet{height:100%;border-radius:0;background:var(--page);box-shadow:none;max-width:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.credit{position:absolute;right:16px;top:8px;font-size:9px;color:var(--muted);opacity:.7;pointer-events:none}
body.no-map .credit{display:none}
.grab{position:relative;padding:10px 20px 0;touch-action:none;cursor:grab;flex-shrink:0}
.handle{width:40px;height:5px;border-radius:3px;background:var(--handle);margin:0 auto 10px}
body.no-map .handle{display:none}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 20px calc(var(--off,0px) + var(--tab-h) + var(--safe-bottom) + 28px)}
body.no-tabs #content{padding-bottom:calc(var(--off,0px) + var(--safe-bottom) + 28px)}
body.no-map #content{--off:0px}
body.no-map #content{padding-top:calc(var(--safe-top) + 24px);max-width:var(--sheet-w);margin:0 auto;width:100%}
#tabbar{position:absolute;z-index:30;left:0;right:0;bottom:0;margin:0 auto;max-width:var(--sheet-w);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--sheet-solid);border-top:1px solid var(--line);padding:6px 8px calc(var(--safe-bottom) + 6px)}
body.no-map #tabbar{max-width:none}
body.no-tabs #tabbar{display:none}
.tab{border:none;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center;font-size:11px;font-weight:600;text-decoration:none}
.tab[aria-current=page]{color:var(--text);font-weight:800}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.lbl{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
body.no-map .card{background:var(--card-solid)}
.card h2{margin:0;font-size:15px;font-weight:800}
a.card{color:var(--text);text-decoration:none}
.badge{width:36px;height:36px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.pill{font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;white-space:nowrap}
.pill.blue{background:var(--blue-bg);color:var(--blue)}.pill.green{background:var(--green-bg);color:var(--green)}.pill.amber{background:var(--amber-bg);color:var(--amber)}.pill.grey{background:var(--card);color:var(--muted)}.pill.red{background:var(--red-bg);color:var(--red)}
.flap{display:inline-flex;gap:3px;align-items:center}
.flap .t{display:inline-flex;align-items:center;justify-content:center;background:#1C1C1E;color:#FFC14D;border-radius:4px;font-family:"Space Mono",monospace;font-weight:700;position:relative;box-shadow:inset 0 -2px 0 rgba(0,0,0,.5)}
.flap .t:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.65)}
.flap .u{font-family:"Space Mono",monospace;font-weight:700;color:var(--muted)}
.flap.lg .t{width:40px;height:54px;font-size:32px}.flap.md .t{width:28px;height:38px;font-size:22px}.flap.sm .t{width:22px;height:30px;font-size:17px}
.flap.lg .u{font-size:22px}.flap.md .u{font-size:15px;padding:0 1px}.flap.sm .u{font-size:12px}
.flap .t.flip{animation:flip .45s ease}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.bar{height:6px;border-radius:3px;background:var(--line);position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--blue)}
.bar>b{position:absolute;top:-3px;width:12px;height:12px;margin-left:-6px;border-radius:6px;background:var(--blue);box-shadow:0 0 10px var(--blue)}
.seg{display:grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;background:var(--card);border-radius:12px;padding:3px;gap:3px}
body.no-map .seg{background:var(--line)}
.seg button{min-height:40px;border:none;border-radius:9px;background:transparent;color:var(--muted);font-size:13px;font-weight:700;padding:0 6px}
.seg button[aria-pressed=true]{background:var(--text);color:var(--page)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:12px;font-weight:700}
.chips button[aria-pressed=true]{background:var(--text);color:var(--page);border-color:var(--text)}
.btn{min-height:52px;border-radius:16px;border:none;background:var(--blue);color:var(--on-blue);font-size:16px;font-weight:800;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-size:14px;min-height:46px}
.btn.dash{background:transparent;color:var(--text);border:1px dashed var(--muted);font-size:15px}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red);font-size:14px;min-height:46px}
.btn.danger.armed{background:var(--red);color:#fff}
.list-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 12px;color:var(--text);text-decoration:none}
.date{width:40px;display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.date span:first-child{font-size:10px;font-weight:800;color:var(--muted)}.date span:last-child{font-size:19px;font-weight:800}
.timechip{font-family:"Space Mono",monospace;font-size:15px;font-weight:700;background:#1C1C1E;color:#FFC14D;padding:6px 8px;border-radius:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
body.no-map .stat{background:var(--card-solid)}
.stat .big{font-size:16px;font-weight:800;overflow-wrap:anywhere}
.tl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13px}
.tl .t1{font-weight:800;text-align:right}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.field input,.field select{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;padding:0 12px;width:100%;min-width:0}
.field input.code{font-family:"Space Mono",monospace;font-size:20px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.field .hint{font-size:12px;color:var(--muted)}
.field .hint.err{color:var(--red)}
details summary{cursor:pointer;font-weight:700;font-size:14px;min-height:44px;display:flex;align-items:center}
.switch{width:52px;height:32px;border-radius:16px;border:none;background:var(--line);position:relative;flex-shrink:0;transition:background .2s}
.switch[aria-checked=true]{background:var(--green)}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.switch[aria-checked=true]:after{left:23px}
.setrow{display:flex;align-items:center;gap:12px;min-height:56px;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:none}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.notice{font-size:12px;background:var(--amber-bg);color:var(--text);border-radius:10px;padding:10px 12px;line-height:1.4}
.empty{text-align:center;padding:24px 8px;display:flex;flex-direction:column;gap:12px;align-items:center}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + var(--safe-bottom) + 20px);background:var(--text);color:var(--page);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:700;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.searchbox{display:flex;align-items:center;gap:10px;min-height:62px;border-radius:18px;background:var(--card);border:2px solid var(--line);padding:0 14px;transition:border-color .2s}
.searchbox:focus-within{border-color:var(--blue)}
.searchbox svg{color:var(--muted);flex-shrink:0}
.searchbox input{flex:1;min-width:0;border:none;background:transparent;color:var(--text);font-family:"Space Mono",ui-monospace,monospace;font-size:22px;font-weight:700;letter-spacing:.06em;outline:none;text-transform:uppercase;padding:0}
.searchbox input::placeholder{font-family:Inter,system-ui,sans-serif;font-size:16px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.datechips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.datechips button,.datechip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;flex-shrink:0}
.chips.datechips button[aria-pressed=true],.chips.datechips .datechip[aria-pressed=true]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.datechip{position:relative;overflow:hidden;cursor:pointer}
.datechip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.modes{display:flex;gap:4px;align-items:center;font-size:13px}
.modes button{border:none;background:transparent;color:var(--muted);font-weight:700;min-height:36px;padding:0 4px}
.modes button[aria-pressed=true]{color:var(--text);text-decoration:underline;text-underline-offset:4px}
.linkbtn{border:none;background:transparent;color:var(--muted);font-size:14px;font-weight:600;min-height:44px}
.linkbtn u{color:var(--text)}
.resultcard{border:2px solid transparent;cursor:default}
.resultcard[role=button]{cursor:pointer}
.resultcard.sel{border-color:var(--blue)}
[hidden]{display:none!important}
/* ---- Motion: quick, under half a second, nothing over the top ---- */
html{touch-action:manipulation}
button,a,.tab,.seg,.chips,.flap,.pill,.grab{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#tabbar{overflow:hidden}
.tab{position:relative;z-index:1}
.tabpill{position:absolute;z-index:0;top:6px;height:48px;border-radius:16px;background:var(--card-solid);box-shadow:inset 0 0 0 1px var(--line);transition:left .42s cubic-bezier(.34,1.56,.64,1),width .42s cubic-bezier(.34,1.56,.64,1),opacity .2s}
[data-theme=dark] .tabpill{background:rgba(255,255,255,.08)}
.tabpill.squash{animation:squash .42s ease}
@keyframes squash{0%{transform:scale(1)}35%{transform:scale(1.14,.84)}65%{transform:scale(.96,1.06)}100%{transform:scale(1)}}
.tab.hop svg{animation:hop .36s cubic-bezier(.34,1.56,.64,1)}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-5px)}100%{transform:translateY(0)}}
.a-sl{animation:inL .3s cubic-bezier(.2,.8,.2,1) both}
.a-sr{animation:inR .3s cubic-bezier(.2,.8,.2,1) both}
.a-up{animation:inU .3s cubic-bezier(.2,.8,.2,1) both}
.a-fade{animation:fadeIn .22s ease both}
@keyframes inL{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inU{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.stg>*{animation:inU .32s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 35ms)}
.flap{perspective:300px}
.flap .t{animation:flapIn .34s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 22ms)}
@keyframes flapIn{from{transform:rotateX(-90deg);opacity:.2}to{transform:none;opacity:1}}
.pill{animation:pop .3s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.bar>i{transform-origin:left;animation:grow .5s cubic-bezier(.2,.8,.2,1) both;transition:width .6s ease}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.btn,.round,.list-row,a.card,.seg button,.chips button,.tab,.switch,.badge{transition:transform .12s ease,background-color .2s,color .2s,border-color .2s}
.btn:active,.list-row:active,a.card:active,.seg button:active,.chips button:active{transform:scale(.97)}
.round:active,.switch:active{transform:scale(.9)}
.toast{animation:toastIn .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.plane-icon svg{transition:transform .3s ease}
@media (prefers-reduced-motion: reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<div id="map" aria-hidden="true"></div>
<div id="map-fallback">Map needs an internet connection</div>
<div id="topbar"><div id="top-left"></div><div id="top-right"></div></div>
<section id="sheet" aria-label="Details">
  <div class="grab" id="grab"><div class="handle"></div><span class="credit" id="credit">© OpenStreetMap · OpenFreeMap · NASA</span><div id="grab-content"></div></div>
  <div id="content"></div>
</section>
<nav id="tabbar" aria-label="Main">
  <span class="tabpill" id="tabpill" aria-hidden="true"></span>
  <a class="tab" href="#/" data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>Flights</a>
  <a class="tab" href="#/passport" data-tab="passport"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><circle cx="12" cy="9" r="3"/></svg>Passport</a>
  <a class="tab" href="#/settings" data-tab="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings</a>
</nav>
</div>
<script src="https://unpkg.com/maplibre-gl@5.23.0/dist/maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
